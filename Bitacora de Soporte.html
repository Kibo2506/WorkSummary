<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bitácora de soporte</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --sf: #fff;
      --tx: #1b2430;
      --mu: #5d6b7a;
      --bd: #d5dce3;
      --ac: #0b6e82;
      --acx: #fff;
      --ok: #1d7a4a;
      --wip: #9a6a00;
      --pen: #a23b3b;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #12181f;
        --sf: #1a222b;
        --tx: #e6ecf2;
        --mu: #9aa8b6;
        --bd: #2c3945;
        --ac: #4fc0d6;
        --acx: #07262d;
        --ok: #5fcf93;
        --wip: #e5b94c;
        --pen: #ef8c8c
      }
    }

    :root[data-theme="dark"] {
      --bg: #12181f;
      --sf: #1a222b;
      --tx: #e6ecf2;
      --mu: #9aa8b6;
      --bd: #2c3945;
      --ac: #4fc0d6;
      --acx: #07262d;
      --ok: #5fcf93;
      --wip: #e5b94c;
      --pen: #ef8c8c
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif
    }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 16px 48px
    }

    h1 {
      font-size: 22px;
      margin: 0 0 2px
    }

    .sub {
      color: var(--mu);
      margin: 0 0 16px
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 14px
    }

    input,
    select,
    textarea,
    button {
      font: inherit;
      color: var(--tx);
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 8px 10px
    }

    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 1px
    }

    button {
      cursor: pointer
    }

    button.p {
      background: var(--ac);
      color: var(--acx);
      border-color: var(--ac);
      font-weight: 600
    }

    .stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px
    }

    .stats span {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 6px;
      padding: 4px 10px;
      color: var(--mu)
    }

    .stats b {
      color: var(--tx)
    }

    form {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 8px;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 18px
    }

    form label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: var(--mu);
      font-size: 13px
    }

    form .w {
      grid-column: 1/-1
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .t {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-left: 4px solid var(--pen);
      border-radius: 6px;
      padding: 10px 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 12px
    }

    .t.en-curso {
      border-left-color: var(--wip)
    }

    .t.hecho {
      border-left-color: var(--ok)
    }

    .t.hecho .ti {
      text-decoration: line-through;
      color: var(--mu)
    }

    .ti {
      font-weight: 600
    }

    .meta {
      color: var(--mu);
      font-size: 13px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px
    }

    .nt {
      grid-column: 1/-1;
      color: var(--mu);
      font-size: 13px;
      white-space: pre-wrap
    }

    .act {
      display: flex;
      gap: 6px;
      align-items: flex-start
    }

    .act button {
      padding: 4px 9px;
      font-size: 13px
    }

    .st {
      font-weight: 600
    }

    .empty {
      color: var(--mu);
      text-align: center;
      padding: 28px;
      border: 1px dashed var(--bd);
      border-radius: 8px
    }
  </style>
</head>

<body>
  <main>
    <h1>Bitácora de soporte</h1>
    <p class="sub">Aqui se puede llevar un control de las tareas por hacer</p>

    <div class="bar">
      <input type="date" id="dia" aria-label="Día">
      <button id="hoy">Hoy</button>
      <input type="search" id="q" placeholder="Buscar…" aria-label="Buscar" style="flex:1;min-width:140px">
      <select id="fe" aria-label="Filtrar por estado">
        <option value="">Todos los estados</option>
        <option>Pendiente</option>
        <option>En curso</option>
        <option>Hecho</option>
      </select>
    </div>

    <div class="stats" id="stats"></div>

    <form id="f">
      <label class="w">Tarea<input id="titulo" required placeholder="Ej. Instalar impresora en recepción"></label>
      <label>Solicitado por<input id="quien" required placeholder="Nombre"></label>
      <label>Área / lugar<input id="area" placeholder="Ej. Contabilidad"></label>
      <label>Categoría<select id="cat">
          <option>Hardware</option>
          <option>Software</option>
          <option>Red</option>
          <option>Cuentas / accesos</option>
          <option>Impresoras</option>
          <option>Mantenimiento</option>
          <option>Otro</option>
        </select></label>
      <label>Prioridad<select id="pri">
          <option>Normal</option>
          <option>Alta</option>
          <option>Baja</option>
        </select></label>
      <label>Medio de solicitud<select id="med">
          <option>Presencial</option>
          <option>Correo</option>
          <option>WhatsApp</option>
          <option>Teléfono</option>
          <option>Ticket</option>
        </select></label>
      <label>Estado<select id="est">
          <option>Pendiente</option>
          <option>En curso</option>
          <option>Hecho</option>
        </select></label>
      <label class="w">Notas / solución aplicada<textarea id="nota" rows="2"></textarea></label>
      <div class="w"><button class="p" type="submit" id="gb">Agregar tarea</button> <button type="button" id="cancel"
          hidden>Cancelar edición</button></div>
    </form>

    <div class="bar">
      <button id="resumen">Copiar resumen del día</button>
      <button id="csv">Exportar todo a CSV</button>
    </div>

    <div class="list" id="lista"></div>
  </main>

  <script>
    (function () {
      var KEY = "bitacora-soporte-v1", tareas = [], editId = null;
      var $ = function (id) {return document.getElementById(id)};
      function cargar() {try {var r = localStorage.getItem(KEY); tareas = r ? JSON.parse(r) : []} catch (e) {tareas = []} }
      function guardar() {try {localStorage.setItem(KEY, JSON.stringify(tareas))} catch (e) { } }
      function hoyStr() {var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10)}
      function esc(s) {return String(s).replace(/[&<>"]/g, function (c) {return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]})}
      function cls(e) {return e.toLowerCase().replace(" ", "-")}
      var orden = {"Pendiente": 0, "En curso": 1, "Hecho": 2}, pr = {"Alta": 0, "Normal": 1, "Baja": 2};

      function render() {
        var dia = $("dia").value, q = $("q").value.toLowerCase(), fe = $("fe").value;
        var delDia = tareas.filter(function (t) {return t.dia === dia});
        var c = {Pendiente: 0, "En curso": 0, Hecho: 0}; delDia.forEach(function (t) {c[t.estado]++});
        $("stats").innerHTML = '<span>Total <b>' + delDia.length + '</b></span><span>Pendientes <b>' + c.Pendiente + '</b></span><span>En curso <b>' + c["En curso"] + '</b></span><span>Hechas <b>' + c.Hecho + '</b></span>';
        var v = delDia.filter(function (t) {
          if (fe && t.estado !== fe) return false;
          return !q || (t.titulo + " " + t.quien + " " + t.area + " " + t.nota + " " + t.cat).toLowerCase().indexOf(q) > -1;
        }).sort(function (a, b) {return orden[a.estado] - orden[b.estado] || pr[a.pri] - pr[b.pri] || a.creado - b.creado});
        $("lista").innerHTML = v.length ? v.map(function (t) {
          return '<div class="t ' + cls(t.estado) + '"><div><div class="ti">' + esc(t.titulo) + '</div>'
            + '<div class="meta"><span>Pidió: ' + esc(t.quien) + '</span>' + (t.area ? '<span>' + esc(t.area) + '</span>' : '')
            + '<span>' + esc(t.cat) + '</span><span>Prioridad ' + esc(t.pri.toLowerCase()) + '</span><span>Vía ' + esc(t.med.toLowerCase()) + '</span></div></div>'
            + '<div class="act"><button data-a="est" data-id="' + t.id + '" class="st" title="Cambiar estado">' + t.estado + '</button>'
            + '<button data-a="ed" data-id="' + t.id + '">Editar</button><button data-a="del" data-id="' + t.id + '">Borrar</button></div>'
            + (t.nota ? '<div class="nt">' + esc(t.nota) + '</div>' : '') + '</div>';
        }).join("") : '<div class="empty">No hay tareas para este día. Agrega la primera arriba.</div>';
      }

      function limpiar() {$("f").reset(); editId = null; $("gb").textContent = "Agregar tarea"; $("cancel").hidden = true}

      $("f").addEventListener("submit", function (e) {
        e.preventDefault();
        var d = {titulo: $("titulo").value.trim(), quien: $("quien").value.trim(), area: $("area").value.trim(), cat: $("cat").value, pri: $("pri").value, med: $("med").value, estado: $("est").value, nota: $("nota").value.trim()};
        if (editId) {var t = tareas.filter(function (x) {return x.id === editId})[0]; if (t) Object.assign(t, d)}
        else {d.id = String(Date.now()); d.creado = Date.now(); d.dia = $("dia").value; tareas.push(d)}
        guardar(); limpiar(); render();
      });
      $("cancel").addEventListener("click", limpiar);
      $("lista").addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        var t = tareas.filter(function (x) {return x.id === b.dataset.id})[0]; if (!t) return;
        if (b.dataset.a === "est") {var s = ["Pendiente", "En curso", "Hecho"]; t.estado = s[(s.indexOf(t.estado) + 1) % 3]; guardar(); render()}
        else if (b.dataset.a === "del") {if (confirm("¿Borrar esta tarea?")) {tareas = tareas.filter(function (x) {return x !== t}); guardar(); render()} }
        else if (b.dataset.a === "ed") {
          editId = t.id; $("titulo").value = t.titulo; $("quien").value = t.quien; $("area").value = t.area; $("cat").value = t.cat; $("pri").value = t.pri; $("med").value = t.med; $("est").value = t.estado; $("nota").value = t.nota;
          $("gb").textContent = "Guardar cambios"; $("cancel").hidden = false; $("titulo").focus(); window.scrollTo({top: 0, behavior: "smooth"});
        }
      });
      ["dia", "q", "fe"].forEach(function (i) {$(i).addEventListener("input", render)});
      $("hoy").addEventListener("click", function () {$("dia").value = hoyStr(); render()});

      $("resumen").addEventListener("click", function () {
        var dia = $("dia").value, l = tareas.filter(function (t) {return t.dia === dia});
        var txt = "Resumen de soporte - " + dia + "\n\n" + l.map(function (t) {return "[" + t.estado + "] " + t.titulo + " (pidió: " + t.quien + (t.area ? ", " + t.area : "") + ")" + (t.nota ? "\n   " + t.nota : "")}).join("\n");
        var ok = function () {$("resumen").textContent = "Copiado"; setTimeout(function () {$("resumen").textContent = "Copiar resumen del día"}, 1500)};
        try {navigator.clipboard.writeText(txt).then(ok, function () {prompt("Copia el resumen:", txt)})} catch (e) {prompt("Copia el resumen:", txt)}
      });
      $("csv").addEventListener("click", function () {
        var h = ["Fecha", "Tarea", "Solicitado por", "Area", "Categoria", "Prioridad", "Medio", "Estado", "Notas"];
        var f = function (v) {return '"' + String(v || "").replace(/"/g, '""') + '"'};
        var rows = tareas.slice().sort(function (a, b) {return a.dia < b.dia ? -1 : 1}).map(function (t) {return [t.dia, t.titulo, t.quien, t.area, t.cat, t.pri, t.med, t.estado, t.nota].map(f).join(",")});
        var txt = h.join(",") + "\n" + rows.join("\n");
        var w = window.open("", "_blank");
        if (w) {w.document.write("<pre>" + esc(txt) + "</pre>"); w.document.title = "bitacora.csv"} else prompt("Copia el CSV:", txt);
      });

      cargar(); $("dia").value = hoyStr(); render();
    })();
  </script>
</body>

</html>
